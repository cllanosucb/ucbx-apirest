<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retiros LMS</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

    <style>
        body {
            padding: 30px;
        }
    </style>

</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col">
                <h1>Retiros LMS</h1>
            </div>
        </div>
        <div class="row">
            <div class="col-5"></div>
            <div class="col-5"></div>
            <div class="col align-self-end">
                <button onclick="reload()" id="rCurso" class="btn btn-primary mb-2">Limpiar Pagina</button>
            </div>
        </div>
        <div class="row">            
            <div class="col-md-6">

                <div class="form-group">
                    <label for="tipoPrograma">Tipo de Programa</label>
                    <select class="form-control" id="tipoPrograma">
                        <option value="1">PREGRADO</option>
                        <option value="2">POSTGRADO</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="idParalelo">Identificador del Paralelo</label>
                    <input type="text" class="form-control" id="idParalelo"
                    aria-describedby="Ingrese el ID del paralelo">
                    <div class="valid-feedback" id="validIdParalelo" style="display: none;">
                        Campo valido!
                    </div>
                    <div class="invalid-feedback" id="invalidIdParalelo" style="display: none;">
                        Ingrese el Identificador del Paralelos.
                    </div>
                </div>
                <div class="form-group">
                    <label for="tipoParalelo">Tipo de Paralelo</label>
                    <select class="form-control" id="tipoParalelo">
                        <option value="1">Teórico</option>
                        <option value="0">Practico</option>
                    </select>
                </div>
                <button onclick="recuperarCurso()" id="rCurso" class="btn btn-primary mb-2">Verificar curso en LMS</button>

                <div class="d-flex justify-content-center">
                    <div class="spinner-border text-primary" role="status" id="loadingrCurso" style="display: none;">
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>

                <div id="respuestaCurso">
                </div>

            </div>
            <div class="col-md-6">

                <div class="form-group">
                    <label for="listaEstudiante">JSON lista estudiantes de SIAAN</label>
                    <textarea class="form-control" id="listaEstudiante" style="height: 200px;" aria-describedby="Ingrese objeto JSON"></textarea>
                    <div class="invalid-feedback" id="invalidListaEstudiante" style="display: none;">
                        Ingrese el JSON con la lista de estudiantes del SIAAN.
                    </div>
                </div>

                <button onclick="retirosPorCurso()" class="btn btn-primary mb-2">Verificar retiros</button>
                <button onclick="procesarRetirosPorCurso()" id="pRetiros" class="btn btn-primary mb-2" style="display: none;">Procesar retiros</button>
                
                <div class="d-flex justify-content-center">
                    <div class="spinner-border text-primary" role="status" id="loadingRetiro" style="display: none;">
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6" id="respuestaRetiro1"></div>
                    <div class="col-md-6" id="respuestaRetiro2"></div>
                </div>

                <!-- <div class="row">
                    <div class="col-md-6">
                        fffff1
                    </div>
                    <div class="col-md-6"></div>
                        fffff2
                    </div>
                </div> -->

            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
        integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>

</body>
</html>
